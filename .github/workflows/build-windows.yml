name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build single-file executable
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Clean

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameAnimeDesk-Windows
          path: dist/FrameAnimeDesk.exe
          compression-level: 0

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\dist\FrameAnimeDesk.exe --generate-notes --title "FRAME $env:GITHUB_REF_NAME"
